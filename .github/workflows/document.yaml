name: document
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: document-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - run: cargo +nightly-2026-04-18 doc --all-features
  web_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - uses: $/.github/actions/setup-node
      - uses: actions/configure-pages@v6.0.0
      - run: tools/document.sh
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: doc/dist
      - uses: actions/deploy-pages@v5.0.1
        if: github.ref == 'refs/heads/main'
  web_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - uses: $/.github/actions/setup-node
      - run: node --run lint:document
  web_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup
      - uses: $/.github/actions/setup-node
      - run: tools/document.sh -l
      - run: node --run preview &
        working-directory: doc
      - uses: raviqqe/muffy@v0.5.8
        with:
          config: muffy.local.toml
  web_release_test:
    needs:
      - web_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: raviqqe/muffy@v0.5.8
  document:
    needs:
      - rust_build
      - web_build
      - web_lint
      - web_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: for result in ${{ join(needs.*.result, ' ') }}; do [ $result = success ]; done
