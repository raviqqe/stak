name: stak/setup
description: Sets up a build environment for Stak Scheme
inputs: {}
outputs: {}
runs:
  using: composite
  steps:
    - uses: raviqqe/cargo-cache@v1.0.4
    - uses: actions/setup-go@v7.0.0
      with:
        go-version: stable
    - uses: raviqqe/enable-homebrew@v1.0.6
    - run: brew update
      shell: bash
    - run: tools/ci/setup.sh
      shell: bash
