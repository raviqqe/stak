[package]
name = "stak-interpret"
version.workspace = true
edition.workspace = true
description = "Stak Scheme bytecode interpreter"
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "stak-interpret"
required-features = ["cli"]

[dependencies]
dlmalloc = { version = "0.2.14", features = ["global"], optional = true }
main_error = { version = "0.1.2", optional = true }
origin = {
  version = "0.26.2",
  default-features = false,
  features = [
    "libc",
  ],
  optional = true
}
stak-configuration = { path = "../../configuration", version = "0.12.35" }
stak-device = { path = "../../device", version = "0.12.35" }
stak-file = { path = "../../file", version = "0.12.35" }
stak-libc = { path = "../../libc", version = "0.12.35", optional = true }
stak-process-context = { path = "../../process-context", version = "0.12.35" }
stak-r7rs = { path = "../../r7rs", version = "0.12.35" }
stak-time = { path = "../../time", version = "0.12.35" }
stak-vm = { path = "../../vm", version = "0.12.35" }

[features]
default = ["float", "std"]
cli = []
float = ["stak-vm/float"]
float62 = ["stak-vm/float62"]
gc_always = ["stak-vm/gc_always"]
libc = [
  "cli",
  "dep:dlmalloc",
  "dep:origin",
  "dep:stak-libc",
  "stak-device/libc",
  "stak-file/libc",
  "stak-process-context/libc",
  "stak-time/libc",
]
std = [
  "cli",
  "dep:main_error",
  "stak-device/std",
  "stak-file/std",
  "stak-process-context/std",
  "stak-time/std",
]
trace_instruction = ["stak-vm/trace_instruction"]
trace_memory = ["stak-vm/trace_memory"]

[lints]
workspace = true
