[package]
name = "stak-bench"
version.workspace = true
edition.workspace = true
publish = false

[[bench]]
harness = false
name = "main"

[[bench]]
harness = false
name = "embed"

[[bench]]
harness = false
name = "io"

[dependencies]
mlua = { version = "0.12.0", features = ["lua55"] }
stak = { path = "../root", version = "0.12.24" }
stak-compiler = { path = "../compiler", version = "0.12.24" }

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "2.7.2" }
indoc = "2.0.7"
tempfile = "3.27.0"

[build-dependencies]
stak-build = { path = "../build", version = "0.12.24" }

[lints]
workspace = true
